# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

lang: en

# Pinned to UTC on purpose. When `timezone:` is unset, Jekyll localizes each
# post's date/time to the BUILDING MACHINE's system clock before extracting
# the /:year/:month/:day/ segment of its permalink — so a post stamped with a
# +0800 offset can land on a different calendar day depending on where the
# build runs. GitHub's Actions runners (and, historically, GitHub Pages'
# legacy Jekyll build) run in UTC, which is what produced the site's current,
# already-indexed permalinks; pinning it here keeps that reproducible on any
# machine (including local testing) instead of depending on the runner's
# ambient timezone.
timezone: UTC

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
title: Random Notes

tagline: A wanderer's notes on programming, hardware, and hacking

description: >-
  I'm a wanderer with an interest in programming, hardware, hacking,
  languages, food, coffee, science. This blog mostly serves as my private
  knowledgebase, but I figured it might be useful to others.

url: "https://www.lunesu.com"

github:
  username: lionello

twitter:
  username: LioLunesu

social:
  name: Lionello Lunesu
  email:
  fediverse_handle: "@lionello@mastodon.social"
  links:
    - https://github.com/lionello
    - https://www.linkedin.com/in/lionello
    - https://twitter.com/LioLunesu
    - https://mastodon.social/@lionello

theme_mode: # [light | dark] — leave empty to follow system + show the toggle

avatar: /assets/img/avatar.jpeg

toc: true

paginate: 10

baseurl: ""

# No `permalink:` override for posts here, deliberately: the site carries 12+
# years of history (a Serendipity import plus native Jekyll posts). Most posts
# already pin their own historical URL via front matter `permalink:`, and the
# handful that don't rely on Jekyll's own default post permalink
# (/:categories/:year/:month/:day/:title.html) — which is exactly what the
# live site has always used (some posts' categories, e.g. "update", are baked
# into their real indexed URL). Setting our own permalink here would silently
# change those URLs and 404 old links/bookmarks/search results.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

kramdown:
  input: GFM
  hard_wrap: false
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

# The archive has 12+ years of real categories/tags (a Serendipity import),
# so these archive pages are load-bearing, not decorative — the post/category
# templates link to them regardless.
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# Dotfiles that still need to be copied through as-is.
include: [".well-known"]

plugins:
  - jekyll-gist

exclude:
  - "*.gem"
  - "*.gemspec"
  - tools
  - vendor
